# Deployment of the fraud API, version 1 (3 replicas).
#   docker build -t fraud-api:v1 .
#   make kind-deploy VERSION=v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-v1
  labels: {app: fraud-api, track: stable}
spec:
  replicas: 3
  selector:
    matchLabels: {app: fraud-api, track: stable}
  template:
    metadata:
      labels: {app: fraud-api, track: stable}
    spec:
      containers:
        - name: api
          image: fraud-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DECISION_THRESHOLD
              value: "0.15"
          # TODO 1: add a readinessProbe and a livenessProbe, both on GET /health, port 8000.
          #   readiness: the pod receives traffic only once it answers. The model takes a few seconds to load.
          #   liveness:  Kubernetes restarts the container if this check fails. A restart is expensive,
          #              so wait longer before the first check than for readiness.
          #   Syntax: httpGet: {path: ..., port: ...}, initialDelaySeconds, periodSeconds.
          # TODO 2: add resources with requests and limits for cpu and memory.
          #   Start from requests 100m / 256Mi and limits 500m / 512Mi, then justify these numbers
          #   with the load test: what happens when memory goes above the limit? CPU above the limit?
