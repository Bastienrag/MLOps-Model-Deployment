name: Train & deploy

# Canonical pipeline: data -> training -> evaluation gate -> image -> manual approval.
# Triggers: a change to the model code or parameters, or manually / on drift (S7):
#   gh workflow run train.yml -f reason="drift PSI 0.31"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this retraining?"
        default: "manual"
  push:
    branches: [main]
    paths:
      - "src/fraud/**"
      - "params.yaml"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dependencies (exact versions from uv.lock)
        run: uv sync --locked

      - name: Data (Kaggle download + split)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }} # needed in Github secrets
        run: uv run --no-sync python -m fraud.data

      - name: Training
        run: uv run --no-sync python -m fraud.train

      - name: Evaluation gate (ROC AUC and PR AUC on the golden set)
        run: uv run --no-sync python -m fraud.evaluate

      - name: Export the promoted model
        run: uv run --no-sync python -m fraud.export_model

      - name: Summary
        run: |
          {
            echo "### Retraining: ${{ inputs.reason || 'push' }}"
            echo '```json'; cat reports/train.json; cat reports/eval.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  publish:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual approval: Settings > Environments > production > Required reviewers
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model/

      - name: Image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/fraud-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
