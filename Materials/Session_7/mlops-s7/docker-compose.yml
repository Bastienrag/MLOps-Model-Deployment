#   docker compose up -d                  # S3 + MLflow + Prometheus + Grafana
#   docker compose --profile api up -d    # API
#
# URLs : MLflow http://localhost:5000 · S3 API http://localhost:8333 (no web page)
#        S3 file browser http://localhost:8888/buckets/ · SeaweedFS status http://localhost:9333
#        Prometheus http://localhost:9090 · Grafana http://localhost:3000 (admin / admin)

name: mlops-fraud

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mlops}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mlops-secret}
  AWS_DEFAULT_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://s3:8333

services:
  # S3 storage - remote DVC & MLflow artifact store
  s3:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    # The S3 API and the filer must use different ports: the filer listens on 8888 by default.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=20
    ports:
      - "8333:8333"   # S3 API (DVC, MLflow, boto3): signed requests only, no web page
      - "8888:8888"   # filer: browse files in a browser at /buckets/
      - "9333:9333"   # master: cluster status page
    volumes:
      - s3-data:/data
      - ./infra/s3/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  # Creates buckets "mlflow" & "dvc" at first start, then stops
  s3-init:
    build: ./docker/mlflow
    image: mlops-mlflow:3.17.2
    entrypoint: ["python", "/scripts/create_buckets.py"]
    environment:
      <<: *s3-env
      BUCKETS: mlflow,dvc
    volumes:
      - ./infra/s3/create_buckets.py:/scripts/create_buckets.py:ro
    depends_on:
      - s3
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Tracking + Model Registry. Artifacts flow through the server (--serve-artifacts) so clients don't need s3 creds
  mlflow:
    build: ./docker/mlflow
    image: mlops-mlflow:3.17.2
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1:*,mlflow:*,host.docker.internal:*,*.app.github.dev"
    environment:
      <<: *s3-env
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # to scrape an API launched off Docker (uvicorn, kubectl port-forward)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Containerized API (S4+). Model is in the image:
  #   python -m fraud.export_model && docker compose --profile api up -d --build
  api:
    profiles: ["api"]
    build: .
    image: fraud-api:dev
    environment:
      PREDICTION_LOG_PATH: /app/logs/predictions.jsonl
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  s3-data:
  pg-data:
  prom-data:
  grafana-data:
