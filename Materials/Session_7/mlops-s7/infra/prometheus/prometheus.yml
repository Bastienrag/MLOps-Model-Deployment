global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API wherever it runs: compose container ("api"), uvicorn started with
  # --host 0.0.0.0 (make api), or the kind cluster (NodePort exposed on port 8080).
  - job_name: fraud-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels: {env: compose}
      - targets: ["host.docker.internal:8000"]
        labels: {env: host}
      - targets: ["host.docker.internal:8080"]
        labels: {env: kind}
