[project]
name = "fraud"
version = "0.1.0"
description = "Use case of the MLOps course: fraud classifier, from notebook to production"
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "evidently>=0.7.23",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "isort>=9.0.2",
    "kagglehub>=1.0.3",
    "locust>=2.47.0",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=2.3,<3",   # evidently 0.7 does not import with pandas 3 (S7 drift)
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
