#   docker build -t fraud-api:v1 . && kind load docker-image fraud-api:v1 --name mlops
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-v1
  labels: {app: fraud-api, track: stable}
spec:
  replicas: 3
  selector:
    matchLabels: {app: fraud-api, track: stable}
  template:
    metadata:
      labels: {app: fraud-api, track: stable}
    spec:
      containers:
        - name: api
          image: fraud-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DECISION_THRESHOLD
              value: "0.15"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          # Le /health de S4 sert aux deux sondes :
          # readiness = "envoie-moi du trafic", liveness = "redémarre-moi si je suis bloqué"
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
