# Pipeline reproductible :  dvc repro  puis  dvc push
# Les données brutes ne sont pas produites par un stage : elles sont versionnées par
# `dvc add` (data/raw/*.dvc) et stockées sur le remote S3.
stages:
  prepare:
    cmd: python -m imu.data
    deps:
      - src/imu/data.py
      - data/raw/GBG500.parquet
      - data/raw/GBG500_labels.csv
    params:
      - data
    outs:
      - data/processed

  baseline:
    cmd: python -m imu.baseline
    deps:
      - src/imu/baseline.py
      - src/imu/evaluate.py
      - data/processed
    params:
      - baseline
    metrics:
      - reports/baseline.json:
          cache: false

  train:
    cmd: python -m imu.train
    deps:
      - src/imu/train.py
      - src/imu/model.py
      - src/imu/evaluate.py
      - data/processed
    params:
      - train
    outs:
      # 15 Ko : suivi par Git et non par DVC, pour que la CI (GitHub) dispose du modèle sans remote.
      - models/cnn.pt:
          cache: false
    metrics:
      - reports/cnn.json:
          cache: false

  cv:
    cmd: python -m imu.cv
    deps:
      - src/imu/cv.py
      - src/imu/train.py
      - src/imu/model.py
      - data/processed
    params:
      - train
      - cv
    metrics:
      - reports/cv.json:
          cache: false

  golden:
    cmd: python -m imu.golden
    deps:
      - src/imu/golden.py
      - data/processed
    params:
      - golden
    outs:
      # Petit fichier suivi par Git : la CI l'utilise pour le gate d'évaluation.
      - ci/golden.npz:
          cache: false

  bundle:
    cmd: python -m imu.bundle
    deps:
      - src/imu/bundle.py
      - data/processed/meta.json
    params:
      - train.channels
      - train.dropout
    outs:
      # Avec models/cnn.pt, c'est tout ce que l'image Docker de l'API embarque.
      - models/meta.json:
          cache: false
