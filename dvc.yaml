# Pipeline reproductible :  dvc repro  puis  dvc push
# Les données brutes ne sont pas produites par un stage : elles sont versionnées par
# `dvc add` (data/raw/*.dvc) et stockées sur le remote S3.
stages:
  prepare:
    cmd: python -m imu.data
    deps:
      - src/imu/data.py
      - data/raw/GBG500.parquet
      - data/raw/GBG500_labels.csv
    params:
      - data
    outs:
      - data/processed

  baseline:
    cmd: python -m imu.baseline
    deps:
      - src/imu/baseline.py
      - src/imu/evaluate.py
      - data/processed
    params:
      - baseline
    metrics:
      - reports/baseline.json:
          cache: false

  train:
    cmd: python -m imu.train
    deps:
      - src/imu/train.py
      - src/imu/model.py
      - src/imu/evaluate.py
      - data/processed
    params:
      - train
    outs:
      - models/cnn.pt
    metrics:
      - reports/cnn.json:
          cache: false

  cv:
    cmd: python -m imu.cv
    deps:
      - src/imu/cv.py
      - src/imu/train.py
      - src/imu/model.py
      - data/processed
    params:
      - train
      - cv
    metrics:
      - reports/cv.json:
          cache: false
