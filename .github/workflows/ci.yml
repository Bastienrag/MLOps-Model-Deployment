name: CI

# À chaque push et pull request : lint, tests, gate d'évaluation du modèle, puis image Docker.
# Le job `docker` ne démarre que si les deux premiers ont réussi (`needs`). Il construit l'image et la
# teste ; il ne la publie sur Docker Hub que sur un push vers main, une fois le smoke test réussi.
#
# Réglages du dépôt pour la publication (sans eux, l'image est construite et testée, pas publiée) :
#   gh variable set DOCKERHUB_USERNAME --body <compte>
#   gh secret set DOCKERHUB_TOKEN          # token d'accès Docker Hub (droits Read & Write)
#
# Échec volontaire, pour vérifier que le gate met bien la pipeline au rouge :
#   gh workflow run ci.yml -f gate_min_balanced_accuracy=0.99

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gate_min_balanced_accuracy:
        description: "Seuil du gate à la place de celui de params.yaml (0.99 : échec volontaire)"
        required: false
        default: ""

# Une nouvelle exécution annule la précédente sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux : la CI ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par empreinte de commit (un tag peut être déplacé), version en commentaire.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7" # la version d'uv qui a produit uv.lock
          enable-cache: true

      # --locked : échoue si uv.lock n'est plus synchronisé avec pyproject.toml
      - name: Dépendances
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Tests
        run: uv run --no-sync pytest -q

  model-gate:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Dépendances
        run: uv sync --locked

      # Évalue models/cnn.pt (versionné dans Git) sur le jeu figé ci/golden.npz.
      # Code de sortie 1 sous les seuils de params.yaml : le job, donc la pipeline, passe au rouge.
      - name: Gate d'évaluation
        env:
          GATE_MIN_BALANCED_ACCURACY: ${{ inputs.gate_min_balanced_accuracy }}
        run: uv run --no-sync python -m imu.gate

      - name: Rapport du gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report
          path: reports/gate.json
          if-no-files-found: ignore
          retention-days: 14

  docker:
    needs: [lint-test, model-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/imu-api
      # Booléen seulement : le secret n'est exposé qu'à l'étape de publication.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La version du modèle annoncée par l'API est le commit qui a produit l'image.
      - name: Construction de l'image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t imu-api:ci .

      - name: Smoke test de l'image
        run: |
          docker run -d --name api -p 8000:8000 imu-api:ci
          test "$(docker exec api id -u)" != "0"   # pas de root dans le conteneur
          python3 ci/smoke_test.py http://localhost:8000 ${{ github.sha }} || { docker logs api; exit 1; }
          docker stop api

      - name: Publication sur Docker Hub
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag imu-api:ci "$IMAGE:${{ github.sha }}"
          docker tag imu-api:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker logout
          echo "Image publiée : https://hub.docker.com/r/$IMAGE (tag ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Image non publiée
        if: env.PUBLISH != 'true'
        run: echo "Image construite et testée, non publiée (hors main, ou identifiants Docker Hub absents)." >> "$GITHUB_STEP_SUMMARY"
