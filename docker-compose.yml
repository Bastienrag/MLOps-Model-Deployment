# Environnement de dev local : MLflow + stockage S3 (artefacts des modèles).
#   cp .env.example .env && docker compose up -d
#
# URLs : MLflow http://localhost:${MLFLOW_PORT:-5000} · S3 API http://localhost:8333
#        Navigateur de fichiers S3 http://localhost:8888/buckets/
#        API http://localhost:${API_PORT:-8000} · Prometheus http://localhost:9090 · Grafana http://localhost:3000

name: mlops-imu

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?copier .env.example vers .env}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?copier .env.example vers .env}
  AWS_DEFAULT_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://s3:8333

services:
  # Stockage S3 : artefacts MLflow et remote DVC
  s3:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    # Le port S3 doit différer de celui du filer (8888 par défaut).
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=20
    environment:
      # SeaweedFS crée l'identité S3 admin à partir de ces variables
      <<: *s3-env
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - s3-data:/data
    restart: unless-stopped

  # Crée les buckets "mlflow" et "dvc" au premier démarrage, puis s'arrête
  s3-init:
    build: ./docker/mlflow
    image: mlops-imu-mlflow:3.17.2
    entrypoint: ["python", "/scripts/create_buckets.py"]
    environment:
      <<: *s3-env
      BUCKETS: mlflow,dvc
    volumes:
      - ./infra/s3/create_buckets.py:/scripts/create_buckets.py:ro
    depends_on:
      - s3
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copier .env.example vers .env}
      POSTGRES_DB: mlflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Tracking + Model Registry ; les artefacts passent par le serveur (--serve-artifacts)
  mlflow:
    build: ./docker/mlflow
    image: mlops-imu-mlflow:3.17.2
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1:*,mlflow:*"
    environment:
      <<: *s3-env
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # API de prédiction : l'image du dépôt (modèle embarqué), avec ses métriques et son log JSON.
  api:
    build: .
    image: mlops-imu-api:dev
    environment:
      PREDICTION_LOG: /app/logs/predictions.jsonl
      LOG_HASH_SALT: ${LOG_HASH_SALT:-imu-dev}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api-logs:/app/logs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  s3-data:
  pg-data:
  api-logs:
  prometheus-data:
  grafana-data:
