# kind create cluster --name imu --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # NodePort du Service imu-api
        hostPort: 8080 # http://localhost:8080 sur la machine
        protocol: TCP
